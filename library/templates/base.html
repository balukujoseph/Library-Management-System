<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>{% block title %}Library{% endblock %}</title>
</head>
<body class="bg-slate-50">
    <nav class="bg-white border-b border-slate-200 px-6 py-4 mb-8 shadow-sm">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="{% url 'library_index' %}" class="text-2xl font-black text-slate-800 tracking-tight">
                Library Management System<span class="text-blue-600">(LMS)</span>
            </a>

            <div class="flex items-center space-x-6">
                <a href="{% url 'library_index' %}" class="text-slate-600 hover:text-blue-600 font-medium transition">Books</a>
                
                {% if user.is_authenticated %}
                    {% if user.is_staff %}
                        <a href="{% url 'admin_dashboard' %}" class="text-orange-600 hover:text-orange-700 font-bold px-3 py-1 bg-orange-50 rounded-lg transition">Staff Panel</a>
                    {% endif %}
                    
                    <div class="flex items-center border-l pl-6 space-x-4">
                        <span class="text-slate-500 text-sm italic">@{{ user.username }}</span>
                        <form action="{% url 'logout' %}" method="post" class="inline">
                            {% csrf_token %}
                            <button type="submit" class="text-sm font-bold text-red-500 hover:text-red-700">Logout</button>
                        </form>
                    </div>
                {% else %}
                    <a href="{% url 'login' %}" class="text-slate-600 hover:text-blue-600 font-medium">Login</a>
                    <a href="{% url 'register' %}" class="bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-bold hover:bg-blue-700 transition">Join Now</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
