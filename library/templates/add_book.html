{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
        <div class="flex items-center gap-4 mb-6">
            <a href="{% url 'admin_dashboard' %}" class="text-slate-400 hover:text-slate-600">← Back</a>
            <h2 class="text-2xl font-bold text-slate-800">Add New Book</h2>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            
            {% for field in form %}
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">{{ field.label }}</label>
                {{ field.errors }}
                <div class="w-full p-3 rounded-xl border border-slate-200 focus-within:ring-2 focus-within:ring-blue-500 bg-slate-50">
                    {% if field.name == 'description' %}
                        <textarea name="{{ field.name }}" class="w-full bg-transparent outline-none" rows="4"></textarea>
                    {% else %}
                        <input type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.name }}" class="w-full bg-transparent outline-none">
                    {% endif %}
                </div>
            </div>
            {% endfor %}

            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                Save & Index Book
            </button>
        </form>
    </div>
</div>
{% endblock %}
